[project]
name = "todohub"
version = "0.7.0"
description = "Personal task capture: Claude Code sweeps Slack, Gmail and Grain; you approve tasks into Linear."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "keyring>=25",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
bundle = ["pyinstaller>=6.10"]

[project.scripts]
todohub = "todohub.cli:main"
todohub-backend = "todohub.__main__:main"
todohub-api = "todohub.api:serve"
todohub-sweep = "todohub.sweep:main"
todohub-db-mcp = "todohub.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todohub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
